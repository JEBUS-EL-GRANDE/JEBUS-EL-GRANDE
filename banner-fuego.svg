<svg width="860" height="330" viewBox="0 0 860 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="47" y="49" width="260" height="260" rx="10" />
    </clipPath>

    
    <filter id="ascii-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      }
      .ascii-layer {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-size: 6.4px;
        letter-spacing: 0.4px;
        white-space: pre;
      }
      /* Alternancia constante de símbolos (3 fotogramas en bucle) */
      .frame-1 { animation: swap1 0.45s steps(1, end) infinite; }
      .frame-2 { animation: swap2 0.45s steps(1, end) infinite; }
      .frame-3 { animation: swap3 0.45s steps(1, end) infinite; }

      @keyframes swap1 {
        0%, 33.32% { opacity: 1; }
        33.33%, 100% { opacity: 0; }
      }
      @keyframes swap2 {
        0%, 33.32% { opacity: 0; }
        33.33%, 66.65% { opacity: 1; }
        66.66%, 100% { opacity: 0; }
      }
      @keyframes swap3 {
        0%, 66.65% { opacity: 0; }
        66.66%, 100% { opacity: 1; }
      }

      /* Pulso sutil de energía en el núcleo y coordenadas */
      .hud-blink {
        animation: hudPulse 2.4s ease-in-out infinite alternate;
      }
      @keyframes hudPulse {
        0% { opacity: 0.45; }
        100% { opacity: 0.95; }
      }

      .c-cyan { fill: #38bdf8; }
      .c-ice  { fill: #bae6fd; }
      .c-mint { fill: #5eead4; }
      .c-dim  { fill: #1e4e68; }
      .c-core { fill: #fb7185; }
    </style>
  </defs>

  
  <rect width="860" height="330" rx="12" fill="#0d0d0d" />

  
